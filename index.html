<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOPOLOGIC — WORLD PORTAL</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080c11;color:#eaf0f4}header{display:flex;justify-content:space-between;align-items:center;padding:30px clamp(22px,5vw,76px);border-bottom:1px solid #26313a;gap:20px}h1{font-size:clamp(17px,2vw,24px);font-weight:650;letter-spacing:.22em;margin:0}small,.muted{color:#84939f}small{letter-spacing:.19em;font-size:10px}.right{display:flex;gap:12px;align-items:center}.pill{border:1px solid #364650;padding:8px 12px;border-radius:30px;font-size:11px;color:#a5d5df}button{cursor:pointer;border:1px solid #3c5e68;border-radius:8px;background:#132029;color:#e8f7f9;padding:10px 15px}button:hover{border-color:#a4f3f7}main{max-width:1350px;margin:auto;padding:clamp(24px,5vw,70px)}.eyebrow{color:#78c7cf;font-size:11px;letter-spacing:.2em}h2{font-size:clamp(34px,5vw,68px);font-weight:450;letter-spacing:-.05em;margin:12px 0 16px}.intro{max-width:600px;line-height:1.7;color:#a5b2bb}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:46px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.world{border:1px solid #263b46;background:linear-gradient(145deg,#152731,#0c141c);min-height:245px;border-radius:14px;padding:23px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:.2s}.world:hover{transform:translateY(-4px);border-color:#77dce6}.orb{height:90px;display:flex;align-items:center;justify-content:center;font-size:48px;color:#7ce1e6;text-shadow:0 0 35px #53c6cf}.world h3{font-size:18px;font-weight:500;margin:10px 0 6px;overflow-wrap:anywhere}.world p{color:#7f9da7;font-size:12px;margin:0}.empty{border:1px dashed #354550;border-radius:14px;padding:35px;color:#9caeb7}.footer{margin-top:55px;font-size:12px;color:#647983}.hidden{display:none!important}#xrScene{position:fixed;inset:0;z-index:50;background:#080c11}#xrScene a-scene{width:100%;height:100%}#closeXR{position:fixed;right:25px;top:22px;z-index:60}#worldView{position:fixed;inset:0;z-index:80;background:#05080a}#worldFrame{width:100%;height:100%;border:0}#back{position:absolute;z-index:90;top:18px;left:18px;background:#0c1b24e8}#notice{color:#ddba87;font-size:12px;min-height:18px;margin-top:12px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.toolbar{margin-top:30px}}
</style></head><body><header><div><small>TOPOLOGIC / SPATIAL ARCHIVE</small><h1>WORLD PORTAL <span style="color:#5bbac4">↗</span></h1></div><div class="right"><span id="device" class="pill">DESKTOP</span><button id="vr" type="button">◉ VR PORTAL</button></div></header><main><div class="eyebrow">EXPLORE / DIGITAL WORLDS</div><h2>Choose a world.</h2><p class="intro">Bu portala yeni bir dünya eklemek için HTML dosyasını veya index.html içeren klasörü <b>worlds</b> içine bırak. Liste otomatik güncellenir.</p><div class="toolbar"><span class="muted" id="count">Dünyalar yükleniyor…</span><button id="refresh">↻ Yenile</button></div><div id="grid" class="grid"></div><p id="notice"></p><div class="footer">AUTO DISCOVERY · DESKTOP / META QUEST 3 · WEBXR</div></main><section id="xrScene" class="hidden"><button id="closeXR">← Kataloğa dön</button><div id="sceneHost" style="height:100%"></div></section><section id="worldView" class="hidden"><button id="back">← PORTALA DÖN</button><iframe id="worldFrame" allow="xr-spatial-tracking; fullscreen; gamepad" allowfullscreen></iframe></section><script>
const $=s=>document.querySelector(s);let worlds=[],vrReady=false;const quest=/Quest|Oculus/i.test(navigator.userAgent);$('#device').textContent=quest?'QUEST 3 / WEBXR':'DESKTOP';
function openWorld(w){if($('#xrScene').classList.contains('hidden')===false){const s=$('a-scene');if(s?.is('vr-mode'))s.exitVR().finally(()=>show(w));else show(w);}else show(w)}
function show(w){$('#xrScene').classList.add('hidden');$('#worldView').classList.remove('hidden');$('#worldFrame').src=new URL(w.url,location.href).href;}
function back(){ $('#worldFrame').src='about:blank';$('#worldView').classList.add('hidden');}$('#back').onclick=back;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='topologic:back')back()});
function render(){const grid=$('#grid');grid.replaceChildren();$('#count').textContent=worlds.length+' WORLD'+(worlds.length===1?'':'S')+' AVAILABLE';if(!worlds.length){const e=document.createElement('div');e.className='empty';e.textContent='Henüz dünya yok. worlds klasörüne bir HTML dosyası ekle.';grid.append(e)}worlds.forEach((w,i)=>{const b=document.createElement('button');b.className='world';const orb=document.createElement('div');orb.className='orb';orb.textContent=['◇','⬡','◎','◈','⟡'][i%5];const info=document.createElement('div');const n=document.createElement('small');n.textContent='WORLD / '+String(i+1).padStart(2,'0');const h=document.createElement('h3');h.textContent=w.title;const p=document.createElement('p');p.textContent='OPEN WORLD ↗';info.append(n,h,p);b.append(orb,info);b.onclick=()=>openWorld(w);grid.append(b)});if(vrReady)renderXR()}
async function load(){try{const r=await fetch('./worlds.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data))throw Error('Invalid world list');if(JSON.stringify(worlds)!==JSON.stringify(data)){worlds=data;render()}$('#notice').textContent=''}catch(e){$('#notice').textContent='Dünya listesi yüklenemedi. GitHub Actions yayınını kontrol edin.';$('#count').textContent='CONNECTION ERROR'}}$('#refresh').onclick=load;load();setInterval(load,5000);
async function startVR(){if(!window.AFRAME){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://aframe.io/releases/1.7.1/aframe.min.js';s.onload=resolve;s.onerror=reject;document.head.append(s)})}if(!AFRAME.components['portal-pinch'])AFRAME.registerComponent('portal-pinch',{init(){this.el.addEventListener('pinchstarted',()=>{const hand=this.el.components['hand-tracking-controls'];const pos=hand?.getPinchPosition?.();if(!pos)return;let best=null,dist=.35;document.querySelectorAll('.xr-choice').forEach(el=>{const v=new THREE.Vector3();el.object3D.getWorldPosition(v);const d=v.distanceTo(pos);if(d<dist){best=el;dist=d}});if(best)best.emit('click')})}});
if(!vrReady){$('#sceneHost').innerHTML=`<a-scene embedded background="color:#080c11" renderer="antialias:true" xr-mode-ui="enabled:true"><a-entity position="0 0 0"><a-camera position="0 1.6 0" look-controls wasd-controls><a-cursor raycaster="objects:.xr-choice" fuse="false"></a-cursor></a-camera><a-entity laser-controls="hand:right" raycaster="objects:.xr-choice"></a-entity><a-entity laser-controls="hand:left" raycaster="objects:.xr-choice"></a-entity><a-entity hand-tracking-controls="hand:right" portal-pinch></a-entity><a-entity hand-tracking-controls="hand:left" portal-pinch></a-entity></a-entity><a-entity id="gallery"></a-entity><a-plane rotation="-90 0 0" position="0 -0.01 -4" width="40" height="40" color="#101c24"></a-plane><a-light type="ambient" intensity="1"></a-light></a-scene>`;vrReady=true;renderXR()}
$('#xrScene').classList.remove('hidden');if(quest){const scene=$('a-scene');if(scene.hasLoaded)scene.enterVR().catch(()=>{});else scene.addEventListener('loaded',()=>scene.enterVR().catch(()=>{}),{once:true})}}
function renderXR(){const gallery=$('#gallery');if(!gallery)return;gallery.replaceChildren();worlds.forEach((w,i)=>{const cols=Math.min(5,Math.max(1,worlds.length));const x=((i%cols)-(cols-1)/2)*1.8,y=1.65-Math.floor(i/cols)*2.2;const panel=document.createElement('a-entity');panel.setAttribute('position',`${x} ${y} -3.8`);const face=document.createElement('a-plane');face.className='xr-choice';face.setAttribute('width','1.55');face.setAttribute('height','1.75');face.setAttribute('color','#18333d');face.setAttribute('material','side:double');face.addEventListener('click',()=>openWorld(w));face.addEventListener('mouseenter',()=>face.setAttribute('color','#286c7b'));face.addEventListener('mouseleave',()=>face.setAttribute('color','#18333d'));panel.append(face);const label=document.createElement('a-text');label.setAttribute('value',w.title.toUpperCase());label.setAttribute('align','center');label.setAttribute('width','2.5');label.setAttribute('wrap-count','19');label.setAttribute('position','0 -.35 .02');panel.append(label);const glyph=document.createElement('a-text');glyph.setAttribute('value','◇');glyph.setAttribute('align','center');glyph.setAttribute('color','#7ce1e6');glyph.setAttribute('width','5');glyph.setAttribute('position','0 .2 .02');panel.append(glyph);gallery.append(panel)})}
$('#vr').onclick=()=>startVR().catch(e=>$('#notice').textContent='VR kütüphanesi yüklenemedi: '+e.message);$('#closeXR').onclick=()=>{const s=$('a-scene');if(s?.is('vr-mode'))s.exitVR();$('#xrScene').classList.add('hidden')};
</script></body></html>
